name: Markdown

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: markdownlint
        run: |
          # Outline notes fail the strict defaults (line length, inline HTML, tight lists).
          cat > "$RUNNER_TEMP/markdownlint.json" <<'EOF'
          {
            "MD007": false,
            "MD009": false,
            "MD010": false,
            "MD012": false,
            "MD013": false,
            "MD022": false,
            "MD024": false,
            "MD025": false,
            "MD027": false,
            "MD032": false,
            "MD033": false,
            "MD034": false,
            "MD041": false,
            "MD047": false,
            "MD053": false,
            "MD058": false,
            "MD060": false
          }
          EOF
          npx --yes markdownlint-cli2@0.24.0 "**/*.md" --config "$RUNNER_TEMP/markdownlint.json"
      - name: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          lycheeVersion: v0.24.2
          fail: true
          args: --no-progress --max-retries 3 --exclude cdn.substack.com "**/*.md" LICENSE
