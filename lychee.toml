verbose = "warn"
no_progress = true
max_retries = 3
max_concurrency = 8
timeout = 30
retry_wait_time = 2
accept = ["200..=299", "429"]
exclude_all_private = true
include_mail = false

exclude = [
  # Medium responds 403 to this checker. The URL is the one in the career ladder notes.
  '^https://inowland\.medium\.com/',
]
